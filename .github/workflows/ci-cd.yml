# GitHub Actions CI/CD Pipeline for ADK Multi-Agent
# Runs evaluation and deploys to Google Cloud Run

name: Module 7 - ADK Agent CI/CD

on:
  push:
    branches: [main]
    paths:
      - "module-7/**"
  pull_request:
    branches: [main]
    paths:
      - "module-7/**"
  workflow_dispatch:

env:
  GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
  GOOGLE_CLOUD_REGION: us-central1
  SERVICE_NAME: adk-multi-agent

jobs:
  # Job 1: Run evaluations
  evaluate:
    name: Run Agent Evaluations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: module-7

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: module-7/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run evaluations (pytest)
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          echo "Running agent evaluations with pytest..."
          python3 -m pytest tests/test_eval.py --junitxml=eval_results.xml

      - name: Run evaluations (adk eval CLI)
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          echo "Running agent evaluations with adk eval..."
          adk eval multi_agent tests/greeter.test.json tests/researcher.test.json --config_file_path=tests/test_config.json --print_detailed_results

      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: module-7/eval_results.xml
          retention-days: 30

  # Job 2: Build and deploy to Cloud Run
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: evaluate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: module-7

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GOOGLE_CLOUD_PROJECT }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Build container image
        run: |
          echo "Building container image..."
          docker build -t gcr.io/${{ env.GOOGLE_CLOUD_PROJECT }}/${{ env.SERVICE_NAME }}:${{ github.sha }} .
          docker tag gcr.io/${{ env.GOOGLE_CLOUD_PROJECT }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
                     gcr.io/${{ env.GOOGLE_CLOUD_PROJECT }}/${{ env.SERVICE_NAME }}:latest

      - name: Push container image
        run: |
          echo "Pushing container image..."
          docker push gcr.io/${{ env.GOOGLE_CLOUD_PROJECT }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          docker push gcr.io/${{ env.GOOGLE_CLOUD_PROJECT }}/${{ env.SERVICE_NAME }}:latest

      - name: Deploy to Cloud Run
        run: |
          echo "Deploying to Cloud Run..."
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image gcr.io/${{ env.GOOGLE_CLOUD_PROJECT }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            --region ${{ env.GOOGLE_CLOUD_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}" \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --port 8080

      - name: Get service URL
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.GOOGLE_CLOUD_REGION }} \
            --format "value(status.url)")
          echo "Deployed to: ${SERVICE_URL}"
          echo "SERVICE_URL=${SERVICE_URL}" >> $GITHUB_ENV

      - name: Smoke test
        run: |
          echo "Running smoke test..."
          sleep 10
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${SERVICE_URL}" || echo "000")
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "Smoke test passed (HTTP ${HTTP_STATUS})"
          else
            echo "Warning: Smoke test returned HTTP ${HTTP_STATUS}"
          fi
